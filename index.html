<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Slap Cards</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1C2047"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Rubik:wght@400;500;700;800&display=swap">
<style>
/* Layout: one fixed 16:9 stage (1280x720) scaled to the screen; every screen sits on a spotlit school desk. Single dark game look by choice. */
:root{
  --ink:#1C2047; --ink2:#2a3070; --room:#0f1126; --room2:#1a1d3d;
  --gum:#FF5FA2; --yel:#FFCF2E; --paper:#F6F3EA; --wood:#8A5532; --wood2:#6b3f22;
  --green:#2EE88A; --blue:#4cc4ff; --purp:#A26BFF; --gold:#E9B21C; --red:#ff5a5a; --muted:#a9acd6;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--room);color:var(--paper);font-family:var(--f-body);overflow:hidden;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#wrap{position:relative;width:100%;height:100%}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;overflow:hidden;border-radius:18px;
  background:radial-gradient(120% 90% at 50% 0%,#2a2f6a 0%,var(--room2) 40%,var(--room) 75%)}
button{font-family:var(--f-body);cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible{outline:3px solid var(--yel);outline-offset:3px}
.screen{position:absolute;inset:0}

/* arena */
.arena{position:absolute;inset:0;pointer-events:none}
.beam{position:absolute;left:50%;top:-80px;width:900px;height:760px;transform:translateX(-50%);background:conic-gradient(from 180deg at 50% 0%,transparent 158deg,rgba(255,240,200,.16) 172deg,rgba(255,240,200,.22) 180deg,rgba(255,240,200,.16) 188deg,transparent 202deg);filter:blur(6px)}
.lamp{position:absolute;left:50%;top:-30px;width:120px;height:56px;transform:translateX(-50%);border-radius:0 0 60px 60px;background:linear-gradient(#3b3f78,#20234a);border:5px solid var(--ink);box-shadow:0 18px 40px rgba(255,230,170,.35)}
.lamp::after{content:"";position:absolute;left:20px;right:20px;bottom:-8px;height:12px;border-radius:50%;background:#fff6d6;box-shadow:0 0 30px 10px rgba(255,236,180,.8)}
.desk{position:absolute;left:50%;bottom:-40px;width:1200px;height:600px;transform:translateX(-50%) perspective(1600px) rotateX(14deg);transform-origin:50% 100%;border-radius:28px;border:8px solid var(--ink);
  background:radial-gradient(70% 70% at 50% 40%,rgba(255,226,170,.30),transparent 70%),repeating-linear-gradient(92deg,transparent 0 22px,rgba(0,0,0,.07) 22px 24px,rgba(255,255,255,.04) 24px 40px),repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 2px,transparent 2px 116px),linear-gradient(180deg,#a8683c,var(--wood) 45%,var(--wood2));box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 0 6px rgba(255,255,255,.06)}
.desk .groove{position:absolute;left:60px;right:60px;top:26px;height:18px;border-radius:10px;background:rgba(0,0,0,.25);box-shadow:inset 0 3px 6px rgba(0,0,0,.4)}
.desk .scratch{position:absolute;height:3px;border-radius:2px;background:rgba(255,255,255,.12)}

/* top bar */
.topbar{position:absolute;left:20px;right:20px;top:14px;display:flex;align-items:center;gap:10px;z-index:20}
.pill{display:flex;align-items:center;gap:8px;height:46px;padding:0 16px 0 7px;border-radius:24px;background:rgba(12,14,38,.82);border:3px solid var(--ink2);font:800 18px var(--f-body);font-variant-numeric:tabular-nums}
.pill small{font:700 13px var(--f-body);color:var(--muted)}
.coin{width:30px;height:30px;border-radius:50%;flex:none;display:inline-block;background:radial-gradient(circle at 35% 30%,#fff3b0,var(--yel) 40%,#d79a10 75%);border:3px solid var(--ink);position:relative;vertical-align:middle}
.coin::after{content:"";position:absolute;inset:5px;border-radius:50%;border:2px solid rgba(28,32,71,.35)}
.coin.s{width:18px;height:18px;border-width:2px;vertical-align:-3px}.coin.s::after{inset:3px;border-width:1.5px}
.shieldic{width:26px;height:26px;flex:none}
.lbadge{width:32px;height:32px;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;font:900 13px var(--f-display);color:var(--ink)}
.spacer{flex:1}
.iconbtn{width:50px;height:50px;border-radius:16px;background:rgba(12,14,38,.82);border:3px solid var(--ink2);display:grid;place-items:center}
.iconbtn svg{width:24px;height:24px}
.back-btn{height:50px;padding:0 18px;border-radius:16px;background:rgba(12,14,38,.88);border:3px solid var(--ink2);font:800 17px var(--f-body);display:flex;gap:8px;align-items:center}

/* buttons */
.btn{position:relative;height:58px;padding:0 26px;border-radius:18px;font:900 19px var(--f-display);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(#ffe27a,var(--yel));border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink),0 10px 20px rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn.pink{background:linear-gradient(#ff8cc0,var(--gum));color:#fff;text-shadow:0 2px 0 var(--ink)}
.btn.blue{background:linear-gradient(#8fdcff,var(--blue))}
.btn.green{background:linear-gradient(#8ff5bf,var(--green))}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--paper);border-color:var(--ink2);box-shadow:0 5px 0 #070818}
.btn.small{height:44px;font-size:14px;padding:0 16px;border-radius:14px}
.btn[disabled]{filter:grayscale(.85) brightness(.7);pointer-events:none}
.badge{position:absolute;top:-9px;right:-9px;min-width:24px;height:24px;padding:0 5px;border-radius:12px;background:var(--red);color:#fff;border:3px solid var(--ink);font:800 12px var(--f-body);display:grid;place-items:center;animation:bob 1.4s ease-in-out infinite;z-index:2}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* menu */
#menu .logo{position:absolute;left:50%;top:62px;width:200px;transform:translateX(-50%);filter:drop-shadow(0 10px 0 rgba(0,0,0,.35));animation:logo 3s ease-in-out infinite}
@keyframes logo{0%,100%{transform:translateX(-50%) rotate(-3deg)}50%{transform:translateX(-50%) rotate(3deg) scale(1.04)}}
#menu .hero{position:absolute;bottom:160px;filter:drop-shadow(0 22px 14px rgba(0,0,0,.45))}
#menu .hero.l{left:225px;height:280px;animation:idle 3.2s ease-in-out infinite}
#menu .hero.r{right:205px;height:250px;animation:float 2.6s ease-in-out infinite}
@keyframes idle{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-4px) scaleY(1.015)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-16px) rotate(2deg)}}
#menu .playwrap{position:absolute;left:50%;bottom:170px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px}
#menu .playbtn{height:92px;padding:0 60px;font-size:38px;border-radius:28px}
#menu .opp{font:600 14px var(--f-body);color:var(--muted)}
#menu .dock{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:14px}
.dockbtn{position:relative;width:124px;height:100px;border-radius:22px;background:rgba(12,14,38,.88);border:4px solid var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:800 14px var(--f-body);box-shadow:0 6px 0 #070818}
.dockbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #070818}
.dockbtn img{height:44px;filter:drop-shadow(0 4px 2px rgba(0,0,0,.4))}
.dockbtn.locked{opacity:.55}
.sidecol{position:absolute;top:84px;display:flex;flex-direction:column;gap:10px;z-index:5}
.sidecol.l{left:20px}.sidecol.r{right:20px}
.widget{position:relative;width:200px;padding:10px 12px;border-radius:18px;background:rgba(12,14,38,.88);border:3px solid var(--ink2);text-align:left;display:flex;gap:10px;align-items:center}
.widget .wi{width:42px;height:42px;flex:none;display:grid;place-items:center}
.widget b{display:block;font:800 14px var(--f-body)}
.widget small{display:block;font:500 12px var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums}
.widget.hot{border-color:var(--yel);box-shadow:0 0 0 3px rgba(255,207,46,.25),0 0 24px rgba(255,207,46,.35)}
.widget.red{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,90,90,.25)}

/* card */
.card{--w:120px;position:relative;width:var(--w);height:calc(var(--w)*1.59);flex:none;border-radius:calc(var(--w)*.075)}
.card .fr{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.card .art{position:absolute;left:10.4%;right:10.7%;top:8.5%;bottom:22%;z-index:2;overflow:hidden;border-radius:calc(var(--w)*.05)}
.card .art .bgfx{position:absolute;inset:0}
.card .art img{position:absolute;left:50%;bottom:4%;height:90%;max-width:98%;object-fit:contain;transform:translateX(-50%);filter:drop-shadow(0 3px 2px rgba(28,32,71,.35))}
.card .num{position:absolute;z-index:3;left:4.2%;top:2.6%;width:15%;aspect-ratio:1;display:grid;place-items:center;font:900 calc(var(--w)*.075) var(--f-display);color:#fff;text-shadow:0 1px 0 var(--ink)}
.card .dots{position:absolute;z-index:3;left:0;right:0;top:83.6%;height:10.4%}
.card .dots i{position:absolute;top:0;height:100%;aspect-ratio:1;border-radius:50%;transform:translateX(-50%) scale(.62);background:radial-gradient(circle at 35% 30%,#fff,var(--c) 45%,#333);border:2px solid var(--ink);opacity:0}
.card .dots i.on{opacity:1}
.card .dots i:nth-child(1){left:24.3%}.card .dots i:nth-child(2){left:50%}.card .dots i:nth-child(3){left:75.7%}
.card .holo{position:absolute;inset:0;z-index:4;border-radius:inherit;pointer-events:none;mix-blend-mode:color-dodge;opacity:0;background:linear-gradient(115deg,transparent 30%,rgba(255,120,220,.55) 42%,rgba(120,255,240,.55) 50%,rgba(255,255,140,.5) 58%,transparent 70%);background-size:250% 250%;background-position:var(--hx,50%) var(--hy,50%)}
.card.r3 .holo{opacity:.45}.card.r4 .holo,.card.mu3 .holo{opacity:.75}
.card.r0{--c:#8ea2ff}.card.r1{--c:var(--green)}.card.r2{--c:var(--blue)}.card.r3{--c:var(--purp)}.card.r4{--c:var(--gold)}
.card .mut{position:absolute;z-index:5;right:5%;top:3%;width:15%;aspect-ratio:1;border-radius:50%;border:2px solid var(--ink)}
.card.mu1{box-shadow:0 0 0 3px #ffcf2e,0 0 16px rgba(255,207,46,.7)}
.card.mu2{box-shadow:0 0 0 3px #7ae7ff,0 0 18px rgba(122,231,255,.8)}
.card.mu3{box-shadow:0 0 0 3px #ff5fa2,0 0 20px rgba(255,95,162,.8)}
.mimg.m1{filter:sepia(1) saturate(3.2) hue-rotate(-8deg) brightness(1.08) drop-shadow(0 0 6px #ffcf2e)!important}
.mimg.m2{filter:saturate(.35) hue-rotate(170deg) brightness(1.3) contrast(1.05) drop-shadow(0 0 7px #7ae7ff)!important}
.mimg.m3{animation:rainbow 2.4s linear infinite}
@keyframes rainbow{from{filter:hue-rotate(0) saturate(1.6)}to{filter:hue-rotate(360deg) saturate(1.6)}}
.r0 .bgfx{background:radial-gradient(circle at 50% 70%,rgba(140,160,255,.35),transparent 60%),linear-gradient(#e7e8ff,#d4d8ff)}
.r1 .bgfx{background:radial-gradient(ellipse 60% 12% at 50% 92%,rgba(46,232,138,.9),transparent 70%),radial-gradient(circle at 50% 60%,rgba(46,232,138,.35),transparent 60%),linear-gradient(#e6fff1,#c6f7dc)}
.r2 .bgfx{background:radial-gradient(ellipse 70% 14% at 50% 92%,rgba(76,196,255,.95),transparent 70%),radial-gradient(circle at 50% 55%,rgba(76,196,255,.45),transparent 62%),linear-gradient(#e8f6ff,#bfe6ff)}
.r3 .bgfx{background:repeating-conic-gradient(from 0deg at 50% 60%,rgba(162,107,255,.35) 0 8deg,transparent 8deg 22deg),radial-gradient(circle at 50% 60%,rgba(255,220,255,.9),rgba(162,107,255,.5) 55%,#5b3aa8)}
.r4 .bgfx{background:radial-gradient(circle at 50% 55%,#fff8d2,rgba(255,207,46,.85) 40%,#c8860a 80%)}
.r4 .bgfx::after{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.45) 0 7deg,transparent 7deg 18deg);animation:spin 10s linear infinite}
.card.missing .art img{filter:brightness(0) opacity(.35)!important;animation:none!important}
.card.missing .bgfx,.card.missing .fr{filter:grayscale(1) brightness(.55)}
.card.missing .holo,.card.missing .mut{display:none}
.card .q{position:absolute;z-index:5;left:50%;top:42%;transform:translate(-50%,-50%);font:900 calc(var(--w)*.34) var(--f-display);color:rgba(255,255,255,.75);text-shadow:0 3px 0 var(--ink)}
.cback{width:var(--w);height:calc(var(--w)*1.59);border-radius:calc(var(--w)*.06);background-size:cover;background-position:center;flex:none}

/* overlays */
.overlay{position:absolute;inset:0;z-index:2000;background:rgba(6,7,20,.74);display:grid;place-items:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.panel{position:absolute;left:22px;right:22px;top:22px;bottom:22px;border-radius:28px;background:linear-gradient(#1b1f4a,#121534);border:4px solid var(--ink);box-shadow:0 0 0 4px var(--ink2),0 30px 60px rgba(0,0,0,.6);display:flex;overflow:hidden;animation:pop .25s cubic-bezier(.3,1.4,.5,1)}
.modal{position:relative;min-width:420px;max-width:860px;max-height:680px;overflow:auto;padding:24px 30px;border-radius:28px;background:linear-gradient(#22265a,#15183a);border:4px solid var(--ink);box-shadow:0 0 0 4px var(--ink2),0 30px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;animation:pop .25s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.modal p{font:500 16px var(--f-body);color:var(--muted);line-height:1.45;max-width:640px}
.modal .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;align-items:center}
.close{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.08);font:800 22px var(--f-body);z-index:5}
.h1{font:900 28px var(--f-display);text-wrap:balance}
.h2{font:800 18px var(--f-display)}
.sub{color:var(--muted);font:500 14px var(--f-body);line-height:1.4}
.side{width:206px;flex:none;padding:16px 12px;display:flex;flex-direction:column;gap:8px;background:rgba(0,0,0,.25);border-right:3px solid var(--ink2);overflow:auto}
.tab{position:relative;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:15px;background:rgba(255,255,255,.04);border:3px solid transparent;text-align:left;flex:none}
.tab img{width:40px;height:40px;object-fit:contain;object-position:top;flex:none}
.tab b{display:block;font:800 13px var(--f-body);line-height:1.15}
.tab small{display:block;font:600 11px var(--f-body);color:var(--muted)}
.tab.on{border-color:var(--c,var(--yel));background:rgba(255,255,255,.1)}
.tab .tick{position:absolute;right:6px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--green);border:2px solid var(--ink)}
.main{position:relative;flex:1;min-width:0;padding:20px 26px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.theme{position:absolute;inset:0;z-index:0;pointer-events:none}
.main>*:not(.theme){position:relative;z-index:1}
.prog{height:14px;border-radius:9px;background:rgba(0,0,0,.4);border:3px solid var(--ink);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--c,var(--green)),#fff);border-radius:6px}
.mtabs{display:flex;gap:8px;flex-wrap:wrap}
.mtab{padding:6px 12px;border-radius:12px;background:rgba(255,255,255,.06);border:3px solid transparent;font:800 13px var(--f-body);display:flex;gap:6px;align-items:center}
.mtab.on{border-color:var(--mc);background:rgba(255,255,255,.12)}
.mtab i{width:12px;height:12px;border-radius:50%;background:var(--mc);border:2px solid var(--ink)}
.cgrid{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-content:flex-start}
.slot{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0}
.slot .nm{font:800 13px var(--f-body)}
.slot .cnt{position:absolute;z-index:7;top:-8px;right:-8px;min-width:30px;height:26px;padding:0 5px;border-radius:13px;background:var(--gum);border:3px solid var(--ink);font:800 12px var(--f-body);display:grid;place-items:center}
.slot .newt{position:absolute;z-index:7;top:-8px;left:-6px;padding:2px 7px;border-radius:9px;background:var(--yel);color:var(--ink);border:3px solid var(--ink);font:900 11px var(--f-display)}
.bonus{display:flex;gap:8px;flex-wrap:wrap}
.bonus span{padding:5px 10px;border-radius:11px;background:rgba(0,0,0,.35);font:700 12px var(--f-body);border:2px solid rgba(255,255,255,.12)}
.th-0{background:radial-gradient(2px 2px at 10% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 30% 80%,#fff,transparent),radial-gradient(2px 2px at 70% 15%,#fff,transparent),radial-gradient(60% 70% at 80% 30%,rgba(162,107,255,.35),transparent),#0b0d2a}
.th-1{background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 2px,transparent 2px 36px),linear-gradient(#173a2b,#0f2a20)}
.th-2{background:radial-gradient(circle at 50% 120%,rgba(46,232,138,.45),transparent 60%),#06241a}
.th-3{background:radial-gradient(circle at 20% 20%,rgba(255,159,192,.35),transparent 40%),radial-gradient(circle at 80% 80%,rgba(155,231,255,.3),transparent 40%),#3a1a36}
.th-4{background:repeating-linear-gradient(0deg,rgba(76,196,255,.07) 0 2px,transparent 2px 60px),repeating-linear-gradient(90deg,rgba(76,196,255,.07) 0 2px,transparent 2px 60px),#071a2b}
.th-5{background:repeating-linear-gradient(170deg,rgba(255,255,255,.05) 0 20px,transparent 20px 60px),linear-gradient(#0b3a5c,#062236)}
.th-6{background:radial-gradient(circle at 20px 20px,rgba(233,178,28,.16) 0 4px,transparent 5px) 0 0/40px 40px,linear-gradient(#2a0f45,#160828)}
.th-7{background:radial-gradient(circle at 85% 12%,#ffe27a 0 24px,transparent 26px),radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 50% 70%,#fff,transparent),linear-gradient(#0c0a26,#1a1240)}
.th-8{background:radial-gradient(circle at 50% 60%,rgba(255,207,46,.4),transparent 55%),#2a1a02}

/* tables */
.tables{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;width:100%}
.tbl{position:relative;border-radius:22px;padding:16px 14px;background:rgba(255,255,255,.05);border:4px solid var(--tc);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-height:330px}
.tbl.locked{border-color:var(--ink2);filter:saturate(.3)}
.tbl .ttl{font:900 20px var(--f-display);color:var(--tc)}
.tbl .ic{height:96px;display:grid;place-items:center}
.tbl .ln{font:600 13px var(--f-body);color:var(--muted);line-height:1.35}
.tbl .ln b{color:var(--paper)}
.tbl .btn{margin-top:auto;width:100%}
.stakebox{display:flex;gap:12px;align-items:flex-end;justify-content:center}
.sslot{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.sslot .lab{font:700 12px var(--f-body);color:var(--muted)}
.sslot.key .lab{color:var(--yel)}
.empty{width:96px;height:153px;border-radius:10px;border:3px dashed var(--ink2);display:grid;place-items:center;color:var(--muted);font:700 12px var(--f-body);padding:6px}
.picker{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-height:250px;overflow:auto;padding:6px}
.pk{position:relative;padding:0}
.pk .cnt{position:absolute;z-index:7;top:-6px;right:-6px;min-width:26px;height:22px;padding:0 4px;border-radius:11px;background:var(--gum);border:2px solid var(--ink);font:800 11px var(--f-body);display:grid;place-items:center}
.pk.dis{opacity:.35;pointer-events:none}
.vs{display:flex;gap:30px;align-items:center}
.vsside{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:240px}
.vsside .av{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#3d4396,#1b1e44);border:4px solid var(--fr,var(--ink));display:grid;place-items:end center;overflow:hidden}
.vsside .av img{height:100px;margin-bottom:-10px}
.vsside .show{display:flex;gap:6px}
.vsword{font:900 40px var(--f-display);color:var(--yel);-webkit-text-stroke:4px var(--ink);paint-order:stroke}

/* shop */
.items{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.item{position:relative;border-radius:20px;background:rgba(255,255,255,.05);border:3px solid var(--ink2);padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.item.eq{border-color:var(--green);background:rgba(46,232,138,.08)}
.item .prev{height:110px;width:100%;overflow:hidden;display:grid;place-items:center;border-radius:14px;background:radial-gradient(circle at 50% 60%,rgba(255,255,255,.08),transparent 70%)}
.item b{font:800 15px var(--f-body)}
.item small{color:var(--muted);font-size:12px;line-height:1.3;min-height:32px}
.item .rar{position:absolute;top:8px;left:8px;padding:2px 8px;border-radius:9px;font:800 10px var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.item .btn{width:100%}
.offer{position:absolute;top:8px;right:8px;padding:2px 8px;border-radius:9px;font:800 10px var(--f-body);background:var(--red);color:#fff}
.gum{position:relative;width:110px;height:150px;flex:none;border-radius:16px;border:4px solid var(--ink);background:repeating-linear-gradient(135deg,#ff7fb6 0 14px,var(--gum) 14px 28px);box-shadow:0 8px 0 rgba(0,0,0,.3);display:grid;place-items:center;overflow:hidden}
.gum::before,.gum::after{content:"";position:absolute;left:0;right:0;height:14px;background:repeating-linear-gradient(90deg,#fff6 0 6px,transparent 6px 12px)}
.gum::before{top:0}.gum::after{bottom:0}
.gum img{width:80%}
.gum.super{background:repeating-linear-gradient(135deg,#c79bff 0 14px,var(--purp) 14px 28px)}
.gum.free{background:repeating-linear-gradient(135deg,#8ff5bf 0 14px,#2bc77a 14px 28px)}
.gum.season{background:repeating-linear-gradient(135deg,#6b5bd6 0 14px,#2a2148 14px 28px)}
.packs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pack{border-radius:20px;padding:14px;background:rgba(255,255,255,.05);border:3px solid var(--ink2);display:flex;gap:16px;align-items:center}
.pack .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.odds{display:flex;gap:5px;flex-wrap:wrap}
.odds span{padding:2px 7px;border-radius:8px;font:700 11px var(--f-body);color:var(--ink);font-variant-numeric:tabular-nums}
.pick{display:flex;gap:30px;margin:8px 0 34px}
.pcard{position:relative;width:170px;height:270px;perspective:900px;padding:0}
.pcard .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.3,.5,1)}
.pcard.open .in{transform:rotateY(180deg)}
.pcard .f,.pcard .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pcard .f{transform:rotateY(180deg)}
.pcard .f .card{--w:170px}
.pcard .b{border-radius:12px;background-size:cover;background-position:center;animation:dealin .45s cubic-bezier(.3,1.4,.5,1) backwards}
.pcard:not(.open):hover .b{transform:translateY(-8px) rotate(-2deg);transition:transform .2s}
.pcard.dim{filter:grayscale(.7) brightness(.55)}
.pcard .nm{position:absolute;bottom:-30px;left:0;right:0;font:800 15px var(--f-body);opacity:0;transition:opacity .3s .4s}
.pcard.open .nm{opacity:1}
@keyframes dealin{from{transform:translateY(200px) rotate(20deg);opacity:0}}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{width:86px;padding:8px 4px;border-radius:14px;background:rgba(255,255,255,.05);border:3px solid var(--ink2);display:flex;flex-direction:column;align-items:center;gap:4px;font:700 12px var(--f-body)}
.day.done{opacity:.4}.day.today{border-color:var(--yel);background:rgba(255,207,46,.12)}.day.big{border-color:var(--purp)}
.quests{display:flex;flex-direction:column;gap:8px;width:580px}
.quest{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.05);text-align:left}
.quest .grow{flex:1}.quest .prog{margin-top:6px;height:12px}
.quest b{font:700 15px var(--f-body)}
.stat{display:flex;justify-content:space-between;gap:30px;padding:7px 0;border-bottom:2px solid rgba(255,255,255,.07);font:600 15px var(--f-body);font-variant-numeric:tabular-nums}
.stat span:first-child{color:var(--muted)}
.lb{display:flex;flex-direction:column;gap:5px}
.lb .row{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:12px;background:rgba(255,255,255,.04);font:600 15px var(--f-body);font-variant-numeric:tabular-nums}
.lb .row.me{background:rgba(255,207,46,.15);outline:2px solid var(--yel)}
.lb .row .pos{width:26px;font:900 15px var(--f-display);color:var(--muted)}
.lb .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .row img{width:30px;height:30px;object-fit:contain;object-position:top}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;padding-top:10px}
.ped{display:flex;flex-direction:column;align-items:center}
.ped img{height:120px;filter:sepia(1) saturate(2.4) hue-rotate(-5deg) brightness(1.05) drop-shadow(0 8px 6px rgba(0,0,0,.4))}
.ped.s2 img{height:100px;filter:grayscale(1) brightness(1.25)}.ped.s3 img{height:92px;filter:grayscale(1) sepia(1) saturate(1.4) hue-rotate(-20deg) brightness(.85)}
.ped .base{width:120px;border-radius:10px 10px 0 0;border:4px solid var(--ink);border-bottom:0;display:flex;flex-direction:column;align-items:center;padding-top:6px;font:900 24px var(--f-display);color:var(--ink)}
.ped .base small{font:700 12px var(--f-body);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ped.s1 .base{height:110px;background:linear-gradient(#ffe27a,var(--gold))}.ped.s2 .base{height:80px;background:linear-gradient(#f0f2ff,#aab0d6)}.ped.s3 .base{height:60px;background:linear-gradient(#ffb98a,#c9733c)}
.ad{position:absolute;inset:0;z-index:5000;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font:700 20px var(--f-body)}
.ad .t{font:900 60px var(--f-display);color:var(--yel)}
.toast{position:absolute;left:50%;top:80px;transform:translateX(-50%);padding:10px 18px;border-radius:14px;background:rgba(15,17,38,.95);border:3px solid var(--ink2);font:700 15px var(--f-body);z-index:3000;text-align:center;animation:toastin .3s ease-out;pointer-events:none;max-width:700px}
.toast.gold{background:#5a3f00;border-color:var(--yel)}.toast.warn{background:#7a1830;border-color:var(--red)}
@keyframes toastin{from{transform:translate(-50%,-20px);opacity:0}}

/* match */
#table{position:absolute;inset:0}
.tcard{position:absolute;width:96px;height:153px;margin:-76px 0 0 -48px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1.4,.5,1),left .45s ease,top .45s ease,opacity .35s;z-index:5;pointer-events:none}
.tcard .sd{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:8px;box-shadow:0 4px 0 rgba(0,0,0,.25),0 8px 14px rgba(0,0,0,.35);background-size:cover;background-position:center}
.tcard .sd.front{transform:rotateY(180deg);box-shadow:none}
.tcard .sd.front .card{--w:96px}
.tcard.bent .sd.backside::after{content:"";position:absolute;right:-2px;top:-2px;width:30px;height:30px;border-radius:0 8px 0 0;background:linear-gradient(225deg,transparent 48%,#f6f3ea 50%,#d8d2c2 70%);box-shadow:-3px 3px 4px rgba(0,0,0,.35)}
.tcard .own{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);backface-visibility:hidden}
.tcard.jump{animation:jump .7s ease-out}
@keyframes jump{0%{margin-top:-76px}35%{margin-top:-170px}100%{margin-top:-76px}}
.seat{position:absolute;display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:40px;background:rgba(12,14,38,.88);border:3px solid var(--ink2);z-index:20}
.seat .av{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#3d4396,#1b1e44);border:3px solid var(--fr,var(--ink));overflow:hidden;display:grid;place-items:end center}
.seat .av img{height:58px;margin-bottom:-6px}
.seat b{font:800 15px var(--f-body);display:block}.seat small{font:500 12px var(--f-body);color:var(--muted)}
.seat.bot{left:20px;top:20px}.seat.me{left:20px;bottom:20px}
.seat.turn{border-color:var(--yel);box-shadow:0 0 0 4px rgba(255,207,46,.25)}
.stack{display:flex;margin-left:6px}
.stack .mini{width:22px;height:35px;margin-left:-10px;border-radius:4px;border:2px solid var(--ink);background-size:cover;background-position:center}
.stack .mini.key{outline:2px solid var(--yel)}
.score{display:flex;align-items:center;gap:5px;margin-left:4px;padding:3px 10px;border-radius:12px;background:rgba(255,255,255,.08);font:900 17px var(--f-display)}
.mhint{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);padding:9px 18px;border-radius:16px;background:rgba(12,14,38,.88);border:3px solid var(--ink2);font:600 15px var(--f-body);text-align:center;z-index:20;max-width:520px;line-height:1.35}
.mhint b{color:var(--yel)}
.power{position:absolute;right:24px;bottom:30px;width:50px;height:300px;border-radius:24px;background:rgba(12,14,38,.9);border:3px solid var(--ink2);z-index:20}
.power .zone{position:absolute;left:4px;right:4px;border-radius:6px;background:rgba(46,232,138,.35);border:3px solid var(--green)}
.power .near{position:absolute;left:4px;right:4px;border-radius:6px;background:rgba(255,207,46,.14)}
.power .bar{position:absolute;left:8px;right:8px;bottom:6px;height:0;border-radius:14px;background:linear-gradient(0deg,#5aa0ff,var(--yel) 70%,var(--gum))}
.power .needle{position:absolute;left:-8px;right:-8px;height:4px;background:#fff;box-shadow:0 0 8px #fff;border-radius:2px}
.types{position:absolute;right:88px;bottom:30px;display:flex;flex-direction:column;gap:8px;z-index:20}
.stype{width:118px;padding:6px 8px;border-radius:14px;background:rgba(12,14,38,.9);border:3px solid var(--ink2);display:flex;align-items:center;gap:6px;text-align:left}
.stype svg{width:34px;height:34px;flex:none}
.stype b{display:block;font:800 13px var(--f-body)}.stype small{display:block;font:600 10px var(--f-body);color:var(--muted);line-height:1.2}
.stype.on{border-color:var(--yel);background:rgba(255,207,46,.14)}
.aim{position:absolute;width:0;height:0;z-index:30;pointer-events:none}
.aim i{position:absolute;left:0;top:0;width:46px;height:46px;border-radius:50%;transform:translate(-50%,-50%);border:4px solid #fff;opacity:.9}
.hand{position:absolute;width:210px;height:250px;margin:-150px 0 0 -105px;z-index:40;pointer-events:none;transition:transform .22s cubic-bezier(.3,.7,.3,1),left .22s,top .22s,opacity .2s;opacity:0}
.hand svg{width:100%;height:100%;overflow:visible}
.pow{position:absolute;z-index:50;font:900 50px var(--f-display);color:var(--yel);-webkit-text-stroke:5px var(--ink);paint-order:stroke;transform:translate(-50%,-50%) rotate(-8deg);animation:powa .9s ease-out forwards;pointer-events:none;white-space:nowrap}
.pow.bad{color:#ff9a9a;font-size:34px}
@keyframes powa{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}18%{transform:translate(-50%,-60%) scale(1.2) rotate(-6deg);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-110%) scale(1) rotate(-6deg);opacity:0}}
.ringfx{position:absolute;z-index:35;border-radius:50%;border:8px solid #fff;transform:translate(-50%,-50%);animation:ringa .55s ease-out forwards;pointer-events:none}
@keyframes ringa{from{width:20px;height:20px;opacity:1}to{width:340px;height:340px;opacity:0;border-width:1px}}
.flash{position:absolute;inset:0;z-index:34;pointer-events:none;animation:flasha .35s ease-out forwards}
@keyframes flasha{from{opacity:1}to{opacity:0}}
.shake{animation:shake .38s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{translate:calc(var(--k)*-2px) calc(var(--k)*1px)}20%,80%{translate:calc(var(--k)*4px) calc(var(--k)*-3px)}30%,50%,70%{translate:calc(var(--k)*-7px) calc(var(--k)*4px)}40%,60%{translate:calc(var(--k)*7px) calc(var(--k)*-4px)}}
#fxc{position:absolute;inset:0;z-index:2500;pointer-events:none}
.rotate{position:fixed;inset:auto 12px 12px 12px;z-index:9999;padding:12px 16px;border-radius:14px;background:rgba(12,14,38,.95);border:2px solid var(--ink2);font:600 15px var(--f-body);display:none;align-items:center;gap:10px}
@media (orientation:portrait) and (max-width:700px){.rotate{display:flex}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* ---------- v4 additions ---------- */
.fan{position:absolute;left:50%;transform:translateX(-50%);display:flex;justify-content:center;z-index:22;pointer-events:none}
.fan.me{bottom:-46px}.fan.bot{top:-70px}
.fan .fc{position:relative;margin:0 -16px;transition:transform .2s,margin .2s;pointer-events:auto;padding:0}
.fan .fc .card{--w:78px}
.fan.me .fc{transform:translateY(0) rotate(var(--r))}
.fan.me.active .fc:hover,.fan.me.active .fc:focus-visible{transform:translateY(-40px) rotate(0deg)}
.fan.me.active .fc{animation:fanbob 1.2s ease-in-out infinite}
@keyframes fanbob{50%{transform:translateY(-10px) rotate(var(--r))}}
.fan.bot .fc{transform:rotate(var(--r))}
.fan.bot .cback{--w:62px}
.fan.me:not(.active) .fc{filter:brightness(.8)}
.pile{position:absolute;z-index:21;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.pile.me{left:36px;bottom:92px}.pile.bot{right:30px;top:92px}
.pile .tower{position:relative;width:70px}
.pile .tower span{position:absolute;left:0;width:70px;height:111px;border-radius:7px;background-size:cover;background-position:center;border:2px solid var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.pile b{font:900 16px var(--f-display);padding:2px 10px;border-radius:10px;background:rgba(12,14,38,.88);border:2px solid var(--ink2);white-space:nowrap}
.pile small{font:600 11px var(--f-body);color:var(--muted)}
.serie{position:absolute;left:50%;top:86px;transform:translateX(-50%);z-index:25;font:900 30px var(--f-display);color:var(--yel);-webkit-text-stroke:4px var(--ink);paint-order:stroke;pointer-events:none;transition:transform .15s}
.serie.pop{transform:translateX(-50%) scale(1.35)}
.serie small{display:block;text-align:center;font:700 13px var(--f-body);color:var(--paper);-webkit-text-stroke:0}
.choose{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);z-index:26;padding:8px 18px;border-radius:14px;background:var(--yel);color:var(--ink);font:800 16px var(--f-body);border:3px solid var(--ink);animation:bob 1s infinite;pointer-events:none}
.hand-pick{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-height:300px;overflow:auto;padding:8px}
.hp{position:relative;padding:0}
.hp .card{--w:84px}
.hp.on{transform:translateY(-6px)}
.hp.on::after{content:"";position:absolute;inset:-5px;border-radius:12px;border:4px solid var(--yel);pointer-events:none}
.hp .cnt{position:absolute;z-index:7;top:-6px;right:-6px;min-width:26px;height:22px;padding:0 4px;border-radius:11px;background:var(--gum);border:2px solid var(--ink);font:800 11px var(--f-body);display:grid;place-items:center}
.nums{display:flex;gap:10px}
.num3{display:flex;align-items:center;gap:8px;height:46px;padding:0 14px 0 8px;border-radius:24px;background:rgba(12,14,38,.82);border:3px solid var(--ink2);font:800 17px var(--f-body);font-variant-numeric:tabular-nums}
.num3 .ic{width:28px;height:28px;display:grid;place-items:center}
.num3 small{font:700 11px var(--f-body);color:var(--muted);display:block;line-height:1}
.deskpile{position:absolute;z-index:6;left:120px;bottom:120px;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.deskpile .tower span{width:80px;height:127px}
.deskpile .tower{width:80px}
.modebtns{display:flex;gap:14px;align-items:center}
.rec{height:70px;padding:0 22px;font-size:20px;border-radius:22px}
/* yard */
.yardview{position:absolute;inset:0;z-index:1900;background:linear-gradient(180deg,#8fd86a,#6dbd50);overflow:hidden;animation:fade .25s}
.yardview .grass{position:absolute;inset:0;background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.12) 0 60px,transparent 61px),radial-gradient(circle at 80% 70%,rgba(255,255,255,.1) 0 80px,transparent 81px),repeating-radial-gradient(circle at 30% 30%,rgba(0,0,0,.035) 0 3px,transparent 3px 14px)}
.yardview .fence{display:none;position:absolute;left:30px;right:30px;top:120px;bottom:30px;border-radius:30px;border:16px solid transparent;border-image:repeating-linear-gradient(90deg,#fff6df 0 10px,transparent 10px 18px) 16;filter:drop-shadow(0 4px 0 rgba(28,32,71,.6));pointer-events:none}
.yardview .rail{display:none;position:absolute;left:36px;right:36px;top:126px;bottom:36px;border-radius:26px;border:5px solid #e8d9b5;pointer-events:none}
.yardview .house{position:absolute;right:70px;top:150px;pointer-events:none}
.yardview .ystat{position:absolute;left:30px;right:30px;top:16px;display:flex;align-items:center;gap:14px;z-index:2500}
.yardview .ystat .av{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#3d4396,#1b1e44);border:5px solid var(--fr,var(--ink));display:grid;place-items:end center;overflow:hidden;flex:none}
.yardview .ystat .av img{height:80px;margin-bottom:-8px}
.yardview .ystat .nm{font:900 26px var(--f-display);color:#fff;text-shadow:0 3px 0 var(--ink)}
.ychip{display:flex;flex-direction:column;padding:6px 12px;border-radius:14px;background:rgba(12,14,38,.85);border:3px solid var(--ink);font:800 16px var(--f-body);font-variant-numeric:tabular-nums}
.ychip small{font:600 11px var(--f-body);color:var(--muted)}
.ychar{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:0}
.ychar img{display:block;filter:drop-shadow(0 6px 0 rgba(28,32,71,.25))}
.ybody{display:block;transform-origin:50% 100%;animation:ybreath 2.6s ease-in-out infinite;animation-delay:var(--dl,0s)}
.yflip{display:block;transition:transform .22s cubic-bezier(.3,1.5,.5,1)}
@keyframes ybreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
.ychar.walk .ybody{animation:ystep .52s linear infinite}
@keyframes ystep{0%{transform:translateY(0) rotate(0) scale(1.06,.94)}12%{transform:translateY(-5px) rotate(-5deg) scale(.97,1.04)}25%{transform:translateY(-11px) rotate(-6deg) scale(1,1)}40%{transform:translateY(-3px) rotate(-2deg) scale(1,1)}50%{transform:translateY(0) rotate(0) scale(1.06,.94)}62%{transform:translateY(-5px) rotate(5deg) scale(.97,1.04)}75%{transform:translateY(-11px) rotate(6deg) scale(1,1)}90%{transform:translateY(-3px) rotate(2deg) scale(1,1)}100%{transform:translateY(0) rotate(0) scale(1.06,.94)}}
.ychar.walk .sh{animation:yshstep .26s linear infinite}
@keyframes yshstep{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.8);opacity:.7}}
.ychar.crawl .ybody{animation:ycrawlidle 2.6s ease-in-out infinite}
.ychar.crawl.walk .ybody{animation:ycrawl .8s ease-in-out infinite}
@keyframes ycrawlidle{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
@keyframes ycrawl{0%,100%{transform:scale(1,1) rotate(0)}30%{transform:scale(1.1,.9) rotate(1deg)}60%{transform:scale(.94,1.06) rotate(-1deg)}}
.ychar.crawl.walk .sh{animation:none}
.ychar.fly .ybody{animation:yfloat 1.9s ease-in-out infinite;animation-delay:var(--dl,0s)}
.ychar.fly.walk .ybody{animation:yflyf .9s ease-in-out infinite}
@keyframes yfloat{0%,100%{transform:translateY(-34px) rotate(-2deg)}50%{transform:translateY(-48px) rotate(2deg)}}
@keyframes yflyf{0%,100%{transform:translateY(-38px) rotate(7deg) scale(1,1)}50%{transform:translateY(-52px) rotate(9deg) scale(1.03,.97)}}

(function(){try{const c=document.createElement('canvas');c.width=1024;c.height=512;const g=c.getContext('2d');

  for(let p=0;p<7;p++){const y0=p*74+rnd(-6,6);g.fillStyle=p%2?'rgba(0,0,0,.05)':'rgba(255,255,255,.035)';g.fillRect(0,y0,1024,74);g.fillStyle='rgba(30,15,5,.45)';g.fillRect(0,y0,1024,2)}
  for(let i=0;i<420;i++){const y=Math.random()*512,amp=rnd(1,6),fr=rnd(.004,.02),ph=rnd(0,7);g.strokeStyle=`rgba(${Math.random()<.5?'60,30,10':'255,220,170'},${rnd(.04,.14)})`;g.lineWidth=rnd(.6,2.2);g.beginPath();
    for(let x=0;x<=1024;x+=16){const yy=y+Math.sin(x*fr+ph)*amp+Math.sin(x*fr*3.1+ph)*amp*.3;x?g.lineTo(x,yy):g.moveTo(x,yy)}g.stroke()}
  for(let k=0;k<6;k++){const x=rnd(60,960),y=rnd(40,470),r=rnd(6,16);const kg=g.createRadialGradient(x,y,0,x,y,r*2.4);kg.addColorStop(0,'rgba(50,22,8,.55)');kg.addColorStop(.4,'rgba(80,40,15,.25)');kg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=kg;g.beginPath();g.ellipse(x,y,r*2.4,r,0,0,7);g.fill()}
  for(let i=0;i<14;i++){g.strokeStyle='rgba(255,240,210,.12)';g.lineWidth=1;const x=rnd(0,1000),y=rnd(0,500),l=rnd(20,90),a=rnd(-.4,.4);g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke()}
  document.documentElement.style.setProperty('--woodtex',`url(${c.toDataURL('image/jpeg',.85)})`)}catch(e){}})();
